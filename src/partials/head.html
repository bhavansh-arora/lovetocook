<!doctype html>
<html lang="en-GB" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#1d0e04">
<link rel="canonical" href="https://www.lovetocook.uk/{{path}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Love to Cook">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://www.lovetocook.uk/assets/img/og.jpg">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
{{robots}}
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/fraunces-v2.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fraunces-italic-v2.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Self-hosted. The Fraunces files default to the site's own settings (weight 360, soft, no wonky alternates at all),
     so text can never flash in the font's bold, sharp default instance. */
  @font-face { font-family: "Fraunces"; font-style: normal; font-weight: 300 700; font-display: block; src: url("assets/fonts/fraunces-v2.woff2") format("woff2"); }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 300 700; font-display: block; src: url("assets/fonts/fraunces-italic-v2.woff2") format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 400 700; font-display: swap; src: url("assets/fonts/inter-tight.woff2") format("woff2"); }
</style>
<link rel="stylesheet" href="assets/css/main.css?v={{v}}">
<script>
  (function (h) {
    h.classList.remove("no-js"); h.classList.add("js");
    try { if (sessionStorage.getItem("ltc:seen")) h.classList.add("ltc-seen"); } catch (e) {}
    setTimeout(function () { if (!h.classList.contains("motion-ok")) h.classList.add("no-motion"); }, 4500);
  })(document.documentElement);
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": ["LocalBusiness", "Bakery"],
  "name": "Love to Cook",
  "description": "Cook school, artisan bakery and pâtisserie in Crieff, Scotland. Hands-on pâtisserie, bread and cookery classes for up to 8 people, taught by Le Cordon Bleu-trained chef Sam Heeney-Governo.",
  "url": "https://www.lovetocook.uk",
  "telephone": "+447541034170",
  "email": "Sam@lovetocook.uk",
  "image": "https://www.lovetocook.uk/assets/img/croissants.jpg",
  "logo": "https://www.lovetocook.uk/assets/img/logo.png",
  "address": { "@type": "PostalAddress", "streetAddress": "16 King Street", "addressLocality": "Crieff", "addressRegion": "Perthshire", "addressCountry": "GB" },
  "founder": { "@type": "Person", "name": "Sam Heeney-Governo", "jobTitle": "Chef, Pâtissier & Artisan Baker" },
  "sameAs": ["https://www.instagram.com/lovetocook.uk"],
  "priceRange": "££"
}
</script>
</head>
